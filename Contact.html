
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"

    <link rel="stylesheet"

          href="pan.jpg"
          type="image/png">

    <script src="https://kit.fontawesome.com/4b4ade4766.js"
            crossorigin="anonymous">
    </script>

</head>


<body>




    <nav class="navbar">


        <!-- TITLE -->

        <div class="head">

            <h1>

                <a href="index.html">

                    <i class="fa-solid fa-arrow-left"></i>

                    My Socials

                </a>

            </h1>

        </div>


        <!-- HAMBURGER -->

        <button class="hamburger"
                id="hamburger">

            ☰

        </button>


        <!-- NAVIGATION -->

        <div class="navlink"
             id="navlink">


            <a href="index.html">
                Home
            </a>


            <a href="Contact.html">
                Contact
            </a>


            <a href="projects.html">
                Projects
            </a>


            <!-- THEME BUTTON -->

            <button id="themeButton"
                    class="theme-button">

                ☀️ Light Mode

            </button>


        </div>

    </nav>


    <!-- =================================
         CONTACT
    ================================= -->

    <section class="social">


        <h3>
            Contact Me
        </h3>


        <p>

            <strong>

                <i class="fa-brands fa-facebook"></i>

                Facebook:

            </strong>


            <a href="https://www.facebook.com/ayemmmmmyemaaaaa/"
               target="_blank">

                Lourdes Vergara

        </p>


        <p>

            <strong>

                <i class="fa-brands fa-instagram"></i>

                Instagram:

               target="_blank">

                @ayem_yema

        <p>

            <strong>

                <i class="fa-solid fa-phone"></i>

                Phone:

            <a href="tel:+639495977057">

                +63 949 597 7057

            </a>

        <p>

            <strong>

    </section>


    <!-- =================================
         JAVASCRIPT
    ================================= -->

    <script>


        /* ==============================
           HAMBURGER MENU
        ============================== */


        const hamburger =
            document.getElementById("hamburger");


        const navlink =
            document.getElementById("navlink");


        hamburger.addEventListener("click", function () {

            navlink.classList.toggle("active");

        });



        /* ==============================
           DARK / LIGHT MODE
        ============================== */


        const themeButton =
            document.getElementById("themeButton");


        const savedTheme =
            localStorage.getItem("theme");


        /* DARK MODE IS DEFAULT */


        if (savedTheme === null || savedTheme === "dark") {

            document.body.classList.add("dark-mode");

            themeButton.textContent =
                "☀️ Light Mode";

            localStorage.setItem("theme", "dark");

        }



        /* ==============================
           CHANGE THEME
        ============================== */


        themeButton.addEventListener("click", function () {


            document.body.classList.toggle("dark-mode");


            if (document.body.classList.contains("dark-mode")) {

                themeButton.textContent =
                    "☀️ Light Mode";

                localStorage.setItem("theme", "dark");

            }

            else {

                themeButton.textContent =
                    "🌙 Dark Mode";

                localStorage.setItem("theme", "light");

            }

        });

    </script>


</body>

</html>
